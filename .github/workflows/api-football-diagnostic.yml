name: API-Football – anslutning och täckning
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-football-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - name: Testa nyckel och ligatäckning utan att publicera data
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          key = os.environ.get("APIFOOTBALL_KEY", "")
          if not key:
              print("RESULTAT: APIFOOTBALL_KEY saknas i GitHub Actions Secrets")
              sys.exit(1)
          print("RESULTAT: GitHub Actions har tillgång till APIFOOTBALL_KEY (värdet visas inte)")

          def get(endpoint, params):
              url = "https://v3.football.api-sports.io/" + endpoint + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "x-apisports-key": key,
                  "Accept": "application/json",
                  "User-Agent": "Stryktipslabbet-Diagnostic/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.load(response)
              except Exception as exc:
                  print("RESULTAT: API-anrop misslyckades (" + type(exc).__name__ + ")")
                  sys.exit(2)
              if data.get("errors"):
                  print("RESULTAT: API nekade anropet (orsak redovisas inte för att undvika läckage)")
                  sys.exit(3)
              if not isinstance(data.get("response"), list):
                  print("RESULTAT: Oväntat svar")
                  sys.exit(4)
              return data["response"]

          leagues = get("leagues", {"country": "England", "season": "2026"})
          wanted = {"Premier League", "Championship", "League One", "League Two"}
          found = {}
          for row in leagues:
              league = row.get("league") or {}
              name = league.get("name")
              if name not in wanted: continue
              season = next((s for s in row.get("seasons", []) if s.get("year") == 2026), None)
              if not season: continue
              coverage = season.get("coverage") or {}
              found[name] = {
                  "players": coverage.get("players") is True,
                  "injuries": coverage.get("injuries") is True,
              }
          print("RESULTAT: API-anslutning lyckades; ligor med 2026-data:", len(found), "/ 4")
          for name in sorted(wanted):
              info = found.get(name)
              if info:
                  print("LIGA:", name, "| spelardata:", info["players"], "| skadeuppgifter:", info["injuries"])
              else:
                  print("LIGA:", name, "| ej tillgänglig på detta konto/säsong")
          print("RESULTAT: Inga spelar-, skade- eller kontouppgifter har publicerats eller sparats.")
