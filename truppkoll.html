<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truppkoll · Stryktipslabbet</title><style>body{background:#101d2b;color:#f0f5fa;font:16px/1.5 system-ui,sans-serif;margin:0;padding:20px;max-width:1050px;margin:auto}a{color:#72dfb3}h1{font-size:1.8rem}h2{font-size:1.2rem}h3{font-size:1rem}section{background:#172b3b;border:1px solid #334858;border-radius:12px;padding:16px;margin:12px 0}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.muted{color:#b9ccda}.warn{color:#ffd3a5}details{margin:10px 0}summary{cursor:pointer}li{margin:5px 0}</style></head><body><nav><a href="index.html">Startsida</a> · <a href="infor-spelstopp.html">Två modeller</a> · <a href="manuell-spelarkoll.html">Manuell känslighetsanalys</a></nav><h1>Startelvor &amp; spelarfrånvaro</h1><p id="status" role="status">Hämtar tidsstämplade uppgifter…</p><p class="muted">Officiellt bekräftad elva, förväntad elva och leverantörens uppgifter visas separat. Saknad uppgift betyder okänt. Inga automatiska ändringar av oddssannolikheten.</p><main id="matches"></main><script>
const e=id=>document.getElementById(id),time=t=>new Date(t).toLocaleString('sv-SE',{timeZone:'Europe/Stockholm'}),node=(tag,t,p)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;if(p)p.append(n);return n};const labels={confirmed:'Bekräftad startelva (källgranskad)',predicted:'Förväntad startelva – inte bekräftad',provider_listed:'Startelva enligt API – ej oberoende verifierad',out:'Saknas',suspended:'Avstängd',doubtful:'Osäker',available:'Rapporterad tillgänglig'};
function source(r,parent){let line=node('p',undefined,parent);let a=node('a',r.publisher,line);if(r.source_url.startsWith('https://'))a.href=r.source_url;a.rel='noopener noreferrer';node('span',' · kontrollerad '+time(r.checked_at),line).className='muted'}
(async()=>{try{const res=await fetch('data/v34/latest.json',{cache:'no-store'});if(!res.ok)throw Error('Aktuellt truppunderlag saknas.');const d=await res.json();if(d.schema!=='v34-team-news-public-v1'||d.matches.length!==13)throw Error('Felaktigt underlag.');if(Date.now()>=Date.parse(d.reg_close_time))throw Error('Spelstopp passerat.');e('status').textContent='Omgång '+d.draw_number+' · spelstopp '+time(d.reg_close_time)+' · byggd '+time(d.generated_at)+' · '+d.coverage.confirmed_lineup_teams+'/26 bekräftade elvor, '+d.coverage.provider_lineup_teams+' elvor från API, '+d.coverage.absence_reports+' statusrapporter. Leverantör: '+d.provider_status+'.';for(const m of d.matches){let c=node('section',undefined,e('matches'));node('h2',m.number+'. '+m.home+' – '+m.away,c);node('p','Avspark '+time(m.kickoff),c).className='muted';if(m.lineup_window_after_cutoff)node('p','Ordinarie startelvsfönster ligger efter kupongens spelstopp.',c).className='warn';let t=node('div',undefined,c);t.className='teams';for(const side of ['home','away']){const s=m.sides[side];let col=node('div',undefined,t);node('h3',s.team,col);if(s.lineup){let det=node('details',undefined,col);node('summary',labels[s.lineup.status],det);let l=node('ol',undefined,det);for(let p of s.lineup.players)node('li',p,l);source(s.lineup,det)}else node('p',s.lineup_conflict?'Motstridiga elvor – kontrollera källorna':'Startelva: ej verifierad',col).className='warn';if(!s.absences.length)node('p','Skador/avstängningar: okänt',col).className='muted';for(const r of s.absences){let a=node('div',undefined,col);node('strong',r.player+' · '+labels[r.status],a);if(r.reason)node('p',r.reason,a);source(r,a)}if(s.absence_conflicts.length)node('p','Motstridiga statusuppgifter: '+s.absence_conflicts.join(', '),col).className='warn'}}}}catch(err){e('status').textContent=err.message}})();
</script></body></html>
