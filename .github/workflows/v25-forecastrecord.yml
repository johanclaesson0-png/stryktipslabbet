name: V25 – Forecast Record import
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/v25_forecastrecord.py'
      - 'tests/test_v25_forecastrecord.py'
      - 'data/v25/forecastrecord_manifest.json'
      - '.github/workflows/v25-forecastrecord.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_v25_forecastrecord.py'
      - if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.v25_forecastrecord --limit 13
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: forecastrecord-review
          path: forecastrecord-review.json
