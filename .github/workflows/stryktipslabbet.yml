name: Stryktipslabbet – samla och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: stryktipslabbet-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kör datakvalitetstester
        run: python -m unittest discover -s tests -v
      - name: Försök samla officiella observationer och facit
        continue-on-error: true
        run: python scripts/collect.py --outdir data
      - name: Skapa och frys tre system per observerad kupong
        run: python -m scripts.analyze --outdir data
      - name: Bygg och rätta personliga 100-kronorssystem
        run: python -m scripts.solo --outdir data
      - name: Frys Spikvakt och jämför garderingar utan facit
        run: python -m scripts.spikvakt --outdir data
      - name: Hämta öppna ligamatcher och bygg formtabeller
        continue-on-error: true
        run: python -m scripts.league_history --outdir data --limit 14
      - name: Version 13 – frys historiska odds- och streckrörelser
        run: python -m scripts.market_moves --outdir data
      - name: Version 14 – jämför experimentell formmodell med marknadsmodellen
        run: python -m scripts.feature_model --outdir data
      - name: Verifiera några äldre utdelningar från Svenska Spel
        continue-on-error: true
        run: python -m scripts.historical_payouts --outdir data --limit 8
      - name: Bygg fem års historik och kronologisk analys
        run: python -m scripts.history5 --outdir data
      - name: Spara endast offentliga källobservationer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'Data: tidsstämplade observations- och historikfiler'
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "GitHub ändrades samtidigt, försöker uppdatera basen ($attempt/5)"
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != "1" ]; then
              echo "Kunde inte publicera nya data utan konflikt."
              exit 1
            fi
          fi
      - name: Bygg säker publiceringsmapp
        run: python -m scripts.publish
      - name: Ladda upp Pages-artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera Stryktipslabbet
        id: deployment
        uses: actions/deploy-pages@v4
