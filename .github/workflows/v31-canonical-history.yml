name: V31 canonical history
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v31_canonical_history.py'
      - '.github/workflows/v31-canonical-history.yml'
permissions:
  contents: read
jobs:
  reconstruct:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'v31-canonical-history'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/v31"
          for spec in initial:15233213903 incremental:15234058123 bulk:15235445280 metadata:15235172093 league:15235356325; do
            name="${spec%:*}"
            id="${spec#*:}"
            mkdir -p "${RUNNER_TEMP}/v31/${name}"
            gh api "repos/${GH_REPO}/actions/artifacts/${id}/zip" > "${RUNNER_TEMP}/v31/${name}.zip"
            unzip -q "${RUNNER_TEMP}/v31/${name}.zip" -d "${RUNNER_TEMP}/v31/${name}"
          done
      - name: Validate and construct separate research datasets
        run: python -m scripts.v31_canonical_history --artifacts "${RUNNER_TEMP}/v31"
      - name: Upload canonical research data
        uses: actions/upload-artifact@v4
        with:
          name: v31-canonical-history
          path: data/v31/
      - name: Persist data to this review branch only
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v31/
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | python -c 'import sys; assert all(p.startswith("data/v31/") for p in sys.stdin.read().splitlines())'
          git commit -m "Store hash-verified canonical research dataset"
          git push origin HEAD:refs/heads/v31-canonical-history
