name: V29 – chronological research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/v29_*.py'
      - 'data/v25/imported/**'
      - 'data/v25/sources.json'
      - 'data/v24/panel.json'
      - 'data/results/**'
      - 'data/analysis/**'
      - 'data/form_model/**'
      - 'tests/test_v29_research.py'
      - '.github/workflows/v29-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_v29_research.py'
      - run: python -m scripts.v29_research
      - uses: actions/upload-artifact@v4
        with:
          name: v29-research
          path: v29-research.json
