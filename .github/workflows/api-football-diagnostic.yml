name: API-Football – anslutning och täckning
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-football-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - name: Testa nyckel och ligatäckning utan att publicera data
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          key = os.environ.get("APIFOOTBALL_KEY", "")
          if not key:
              print("RESULTAT: APIFOOTBALL_KEY saknas i GitHub Actions Secrets")
              sys.exit(1)
          import re
          key = key.strip()
          print("RESULTAT: GitHub Actions har tillgång till APIFOOTBALL_KEY (värdet visas inte)")
          print("DIAGNOSTIK: Nyckelns format ser rätt ut:", bool(re.fullmatch(r"[0-9a-fA-F]{32}", key)))
          if not re.fullmatch(r"[0-9a-fA-F]{32}", key):
              print("DIAGNOSTIK: Secret innehåller sannolikt fel text, extra tecken eller felaktig nyckel.")
              sys.exit(5)

          def get(endpoint, params):
              url = "https://v3.football.api-sports.io/" + endpoint + "?" + urllib.parse.urlencode(params)
              print("DIAGNOSTIK: Begär endpoint", endpoint)
              req = urllib.request.Request(url, headers={
                  "x-apisports-key": key,
                  "Accept": "application/json",
                  "User-Agent": "Stryktipslabbet-Diagnostic/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read(300000)
                      http_status = response.status
                      content_type = response.headers.get("Content-Type", "").split(";")[0].strip().lower()
                  try:
                      data = json.loads(raw)
                  except json.JSONDecodeError:
                      print("RESULTAT: API svarade med icke-JSON. HTTP:", http_status,
                            "| Content-Type:", content_type[:50],
                            "| Svarsstorlek:", len(raw), "byte")
                      sys.exit(2)
              except Exception as exc:
                  print("RESULTAT: API-anrop misslyckades (" + type(exc).__name__ + ")")
                  print("DIAGNOSTIK: Källa", type(exc).__module__ + "." + type(exc).__qualname__)
                  sys.exit(2)
              if data.get("errors"):
                  errors = data["errors"]
                  # Only safe error-category names; never print vendor text, request headers, or key.
                  if isinstance(errors, dict):
                      classes = sorted(str(k)[:48] for k in errors.keys())
                  elif isinstance(errors, list):
                      classes = ["list"]
                  else:
                      classes = [type(errors).__name__]
                  print("RESULTAT: API nekade anropet")
                  print("DIAGNOSTIK: Felkategorier:", ", ".join(classes) or "okänd")
                  sys.exit(3)
              if not isinstance(data.get("response"), list):
                  print("RESULTAT: Oväntat svar")
                  sys.exit(4)
              return data["response"]

          leagues = get("leagues", {"country": "England", "season": "2024"})
          wanted = {"Premier League", "Championship", "League One", "League Two"}
          found = {}
          for row in leagues:
              league = row.get("league") or {}
              name = league.get("name")
              if name not in wanted: continue
              season = next((s for s in row.get("seasons", []) if s.get("year") == 2024), None)
              if not season: continue
              coverage = season.get("coverage") or {}
              found[name] = {
                  "players": coverage.get("players") is True,
                  "injuries": coverage.get("injuries") is True,
              }
          print("RESULTAT: API-anslutning lyckades; ligor med historiska 2024-data:", len(found), "/ 4")
          for name in sorted(wanted):
              info = found.get(name)
              if info:
                  print("LIGA:", name, "| spelardata:", info["players"], "| skadeuppgifter:", info["injuries"])
              else:
                  print("LIGA:", name, "| ej tillgänglig på detta konto/säsong")
          print("RESULTAT: Historisk API-täckning testad, inte aktuell 2026/27-åtkomst. Inga spelar-, skade- eller kontouppgifter har publicerats eller sparats.")
